name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/check_coverage.dart
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lcov-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  android-debug-build:
    name: Android ${{ matrix.flavor }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [development, staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug --flavor ${{ matrix.flavor }} --target lib/main_${{ matrix.flavor }}.dart
