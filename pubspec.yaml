name: cat_breeds
description: Cat breeds explorer.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.0.1
  intl: ^0.20.2

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  test: ^1.31.1
  very_good_analysis: ^11.0.0

flutter:
  default-flavor: development
  generate: true
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
  assets:
    - assets/images/branding/splash_screen.jpg
    - assets/images/placeholders/placeholder.jpg
